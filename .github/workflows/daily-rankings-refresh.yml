name: Daily rankings refresh

# 10:00 UTC ≈ 6:00 AM America/New_York during EDT, 5:00 AM during EST.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Skip live scrape; only re-export existing CSVs"
        type: boolean
        default: false
      skip_commit:
        description: "Do not commit or push (dry run)"
        type: boolean
        default: false
      only_jobs:
        description: "Optional jobs: mbb,sidearm,baseball,golf,export (empty = all)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-rankings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape, rank, and export
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.skip_scrape }}" = "true" ]; then
            args+=(--skip-scrape)
          fi
          if [ -n "${{ inputs.only_jobs }}" ]; then
            args+=(--only "${{ inputs.only_jobs }}")
          fi
          python scripts/run_daily_refresh.py "${args[@]+"${args[@]}"}"

      - name: Optional Postgres sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret not set; skipping DB sync (d3rank.com loads GitHub JSON)."
            exit 0
          fi
          cd frontend
          npm ci
          npx tsx scripts/sync-rankings-to-db.ts

      - name: Commit and push updated data
        if: ${{ github.event_name == 'schedule' || inputs.skip_commit != true }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data frontend/public/data
          if git diff --cached --quiet; then
            echo "No ranking data changes to commit."
            exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          git commit -m "Refresh daily rankings data (${day})"
          git pull --rebase origin "$BRANCH"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 4))
            git pull --rebase origin "$BRANCH" || true
          done
          echo "Push failed after retries."
          exit 1
