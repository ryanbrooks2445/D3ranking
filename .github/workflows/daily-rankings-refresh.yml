name: Daily rankings refresh

# 10:00 UTC ≈ 6:00 AM America/New_York during EDT, 5:00 AM during EST.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Skip live scrape; only re-export existing CSVs"
        type: boolean
        default: false
      skip_commit:
        description: "Do not commit or push (dry run)"
        type: boolean
        default: false
      only_jobs:
        description: "Optional jobs: mbb,sidearm,baseball,golf,export (empty = all)"
        type: string
        default: ""
      skip_instagram:
        description: "Skip the Instagram @d3rank post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-rankings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape, rank, and export
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.skip_scrape }}" = "true" ]; then
            args+=(--skip-scrape)
          fi
          if [ -n "${{ inputs.only_jobs }}" ]; then
            args+=(--only "${{ inputs.only_jobs }}")
          fi
          python scripts/run_daily_refresh.py "${args[@]+"${args[@]}"}"

      - name: Generate Instagram graphic
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/instagram_daily_post.py --generate

      - name: Upload Instagram graphic
        uses: actions/upload-artifact@v4
        with:
          name: instagram-daily-graphic
          path: artifacts/instagram/
          if-no-files-found: warn

      - name: Optional Postgres sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret not set; skipping DB sync (d3rank.com loads GitHub JSON)."
            exit 0
          fi
          cd frontend
          npm ci
          npx tsx scripts/sync-rankings-to-db.ts

      - name: Commit and push updated data
        if: ${{ github.event_name == 'schedule' || inputs.skip_commit != true }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data frontend/public/data artifacts/instagram
          if git diff --cached --quiet; then
            echo "No ranking data changes to commit."
            exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          git commit -m "Refresh daily rankings data (${day})"
          git pull --rebase origin "$BRANCH"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 4))
            git pull --rebase origin "$BRANCH" || true
          done
          echo "Push failed after retries."
          exit 1

      - name: Post to Instagram @d3rank
        if: ${{ github.event_name == 'schedule' || inputs.skip_instagram != true }}
        env:
          PYTHONUNBUFFERED: "1"
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_IMAGE_PUBLIC_URL: ${{ secrets.IG_IMAGE_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${IG_USER_ID:-}" ] || [ -z "${IG_ACCESS_TOKEN:-}" ]; then
            echo "IG_USER_ID / IG_ACCESS_TOKEN not set; skipping Instagram post."
            exit 0
          fi
          if [ -z "${IG_IMAGE_PUBLIC_URL:-}" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_commit }}" = "true" ]; then
              echo "skip_commit is set and IG_IMAGE_PUBLIC_URL is empty; cannot publish (need a public JPEG URL)."
              exit 0
            fi
            sha="$(git rev-parse HEAD)"
            export IG_IMAGE_PUBLIC_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${sha}/artifacts/instagram/daily-rankings.jpg"
            export IG_IMAGE_REF="$sha"
          fi
          python scripts/instagram_daily_post.py --publish --skip-if-no-secrets || {
            echo "Instagram post failed (non-fatal); rankings refresh still succeeded."
            exit 0
          }
